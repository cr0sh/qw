[package]
name = "qw-runtime"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/cr0sh/qw"
publish = false

[features]
default = ["dflash2"]
dflash2 = []
specprefill = []
dlsa = ["dep:sha2"]

[dependencies]
anyhow.workspace = true
image.workspace = true
memmap2.workspace = true
minijinja.workspace = true
mlxcel-core.workspace = true
safetensors.workspace = true
serde.workspace = true
serde_json.workspace = true
tokenizers.workspace = true
tracing.workspace = true
sha2 = { version = "0.11", optional = true }


[[example]]
name = "specprefill_experiment"
required-features = ["specprefill"]

[[bench]]
name = "single_user_throughput"
harness = false

