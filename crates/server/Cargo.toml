[package]
name = "qw-server"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/cr0sh/qw"
publish = false

[features]
default = []
specprefill = ["qw-runtime/specprefill"]

[[bin]]
name = "qw-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
image.workspace = true
axum.workspace = true
clap.workspace = true
clap_derive.workspace = true
futures-util.workspace = true
llguidance.workspace = true
mlxcel-core = { path = "../mlxcel-core", features = ["metal", "accelerate"] }
qw-runtime = { path = "../runtime" }
qw-prefix-cache = { path = "../prefix-cache" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokenizers.workspace = true
toktrie.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
tracing-appender.workspace = true

[dev-dependencies]
tower.workspace = true
