[package]
name = "qw-cli"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/cr0sh/qw"
publish = false

[features]
default = ["dflash2"]
dflash2 = ["qw-runtime/dflash2", "qw-server/dflash2"]
specprefill = ["qw-runtime/specprefill", "qw-server/specprefill"]

[[bin]]
name = "qw"
path = "src/main.rs"

[dependencies]
clap.workspace = true
clap_derive.workspace = true
qw-runtime = { path = "../runtime" }
qw-server = { path = "../server" }
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
